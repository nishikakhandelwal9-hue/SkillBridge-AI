<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | SkillBridge AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #5145cd, #8678f9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 380px;
            max-width: 92%;
            box-shadow: 0 10px 30px #3333;
            text-align: center;
        }

        h2 {
            color: #5145cd;
        }

        p {
            color: #666;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #5145cd;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        a {
            color: #5145cd;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🎓 SkillBridge AI</h2>
    <p>Welcome Back! Login to Your Account</p>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Enter Your Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Enter Your Password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <p id="message" role="status"></p>

    <p>
        Don't have an account?
        <a href="register.html">Register Now</a>
    </p>

    <p>
        <a href="index.html">← Back to Home</a>
    </p>

</div>

<script>

document.getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const message = document.getElementById("message");
        const button = document.querySelector('button[type="submit"]');

        button.disabled = true;
        message.style.color = "#555";
        message.textContent = "Checking your details...";

        try {
            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok) {
                message.style.color = "green";
                message.textContent =
                    "Welcome, " + data.name + "! Login successful.";

                document.getElementById("loginForm").reset();
                setTimeout(() => {
    window.location.href = "dashboard.html";
}, 1200);

            } else {
                message.style.color = "red";
                message.textContent =
                    data.message || "Login failed.";
            }

        } catch (error) {
            message.style.color = "red";
            message.textContent =
                "Unable to connect to the server.";
            console.error(error);

        } finally {
            button.disabled = false;
        }
    });
</script>


</body>
</html>
